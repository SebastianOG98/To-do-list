<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do list</title>
</head>
<body>
<div class="container">
    <h1>Lista de tareas</h1>
    <div class="input-container">
        <input type="text" placeholder="Añade una nueva tarea" id="addTask">
        <button id="btnAddTask">Añadir</button>
    </div>

    <div class="counters">
        <span>Total: <strong id="totalCount">0</strong></span>
        <span>Completadas: <strong id="completedCount">0</strong></span>
        <span>Pendientes: <strong id="pendingCount">0</strong></span>
    </div>

    <div class="keyboard-hint">
        <span><kbd>Enter</kbd> para agregar</span>
        <span><kbd>Delete</kbd> para eliminar la última</span>
    </div>

    <ul id="taskList"></ul>
</div>
    <script type="module" src="script.js"></script>
    <script src="script.js"></script>
</body>
</html>
